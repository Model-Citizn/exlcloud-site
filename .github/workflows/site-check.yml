name: Site consistency check
# Fails if any generated route page / sitemap is out of sync with index.html + articles-data.jsx,
# or if stale claims (old skill counts, old pricing) creep back in.
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build-pages.mjs --check
